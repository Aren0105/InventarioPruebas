<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/login-dash.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow">
            <div class="card-body p-4">
              <h4 class="card-title text-center mb-4">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
              </h4>
              <form th:action="@{/login}" method="post">
                <div th:if="${param.error != null}" class="alert alert-danger">
                  Credenciales inválidas. Intente nuevamente.
                </div>
                <div th:if="${param.logout != null}" class="alert alert-info">
                  Sesión cerrada correctamente.
                </div>
                <div
                  th:if="${param.registro != null}"
                  class="alert alert-success"
                >
                  Registro exitoso. Ya puedes iniciar sesión.
                </div>
                <div class="mb-3">
                  <label for="loginEmail" class="form-label"
                    >Correo electrónico</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="loginEmail"
                    name="username"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="loginPassword" class="form-label"
                    >Contraseña</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="loginPassword"
                    name="password"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Ingresar
                </button>
              </form>
              <p class="text-center mt-3 mb-0">
                ¿No tienes cuenta?
                <a th:href="@{/login/registro}" class="text-decoration-none"
                  >Regístrate aquí</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
