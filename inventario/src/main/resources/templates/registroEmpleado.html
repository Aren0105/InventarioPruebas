<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Empleado</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/login-dash.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow">
            <div class="card-body p-4">
              <h4 class="card-title text-center mb-4">
                <i class="bi bi-person-plus"></i> Registro de Empleado
              </h4>

              <form
                th:object="${empleado}"
                th:action="@{/login/registrar-empleado}"
                method="post"
              >
                <div
                  th:if="${#fields.hasAnyErrors()}"
                  class="alert alert-danger"
                >
                  Corrige los errores del formulario.
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input
                      type="text"
                      class="form-control"
                      th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                      th:field="*{nombre}"
                    />
                    <div class="invalid-feedback" th:errors="*{nombre}">
                      Error
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input
                      type="text"
                      class="form-control"
                      th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'"
                      th:field="*{apellido}"
                    />
                    <div class="invalid-feedback" th:errors="*{apellido}">
                      Error
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label"
                    >Correo electrónico</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                    th:field="*{email}"
                  />
                  <div class="invalid-feedback" th:errors="*{email}">Error</div>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control"
                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                    th:field="*{password}"
                    minlength="6"
                  />
                  <div class="invalid-feedback" th:errors="*{password}">
                    Error
                  </div>
                </div>
                <div class="mb-3">
                  <label for="rol" class="form-label">Rol</label>
                  <select
                    class="form-select"
                    th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid'"
                    th:field="*{rol}"
                  >
                    <option value="">Seleccionar rol...</option>
                    <option
                      th:each="r : ${T(com.proyecto.sistema.inventario.entities.Rol).values()}"
                      th:value="${r}"
                      th:text="${r}"
                    >
                      Administrador
                    </option>
                  </select>
                  <div class="invalid-feedback" th:errors="*{rol}">Error</div>
                </div>
                <button type="submit" class="btn btn-success w-100">
                  Registrarse
                </button>
              </form>

              <p class="text-center mt-3 mb-0">
                ¿Ya tienes cuenta?
                <a th:href="@{/login}" class="text-decoration-none"
                  >Inicia sesión aquí</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
