<!doctype html>
<html lang="en" xmlns="https://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
  </head>
  <body>
    <div th:replace="layouts :: mobile_navbar"></div>
    <div th:replace="layouts :: offcanvas_sidebar"></div>
    <div class="main-container">
      <div th:replace="layouts :: sidebar"></div>
      <div class="container-right">
        <div class="title p-2">
          <h2 class="text-center text-success fw-bold">Dashboard</h2>
        </div>
        <section class="mt-3 p-3">
          <p class="fw-bold fs-4">Sistema de gestión</p>
          <p class="text-muted">Bienvendio al sistema Premium Parts</p>
          <div class="row g-3">
            <div class="col-12 col-md-6 col-xl-3">
              <div class="card shadow">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <span class="fw-bold">Total de ventas</span>
                    <i class="bi bi-credit-card-2-front-fill"></i>
                  </div>
                  <div class="fw-bold fs-4 mt-2">120</div>
                  <div class="text-muted">+8% vs mes anterior</div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <div class="card shadow">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <span class="fw-bold">Total de productos</span>
                    <i class="bi bi-bar-chart-line-fill"></i>
                  </div>
                  <div class="fw-bold fs-4 mt-2">67</div>
                  <div class="text-muted">+3 nuevos ingresos</div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <div class="card shadow">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <span class="fw-bold">Productos con bajo stock</span>
                    <i class="bi bi-exclamation-octagon"></i>
                  </div>
                  <div class="fw-bold fs-4 mt-2">13</div>
                  <div class="text-muted">Menos de 10 unidades</div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <div class="card shadow">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <span class="fw-bold">Total de ingresos</span>
                    <i class="bi bi-cash-coin"></i>
                  </div>
                  <div class="fw-bold fs-4 mt-2">S/8,400</div>
                  <div class="text-muted">+15% vs mes anterior</div>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section class="px-4">
          <div class="card shadow chart-card">
            <div class="card-body">
              <h2 class="h6 fw-bold mb-3">Ingresos mensuales</h2>
              <canvas id="revenueChart" height="80"></canvas>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/main.js}"></script>
  </body>
</html>
