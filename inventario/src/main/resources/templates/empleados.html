        <div class="table-responsive mt-5">
          <table class="table mt-5 w-75 text-center mx-auto table-bordered">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="emp : ${listar}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.nombre}"></td>
                <td th:text="${emp.apellido}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.rol}"></td>
                <td class="d-flex gap-2 justify-content-center">
                  <button
                    class="btn btn-success"
                    type="button"
                    aria-label="Modificar empleado"
                    data-bs-toggle="modal"
                    data-bs-target="#modalEditarEmpleado"
                    th:attr="data-id=${emp.id}, data-nombre=${emp.nombre}, data-apellido=${emp.apellido}, data-email=${emp.email}, data-password=${emp.password}, data-rol=${emp.rol}"
                    onclick="cargarDatosModal(this)"
                  >
                    <i class="bi bi-person-fill-gear">Modificar</i>
                  </button>
                  <form
                    th:action="@{/empleados/eliminar/{id}(id=${emp.id})}"
                    method="post"
                  >
                    <button
                      class="btn btn-danger"
                      type="submit"
                      onclick="return confirm('¿Estás seguro...?');"
                    >
                      <i class="bi bi-person-x-fill">Eliminar</i>
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="modalEditarEmpleado"
      tabindex="-1"
      aria-labelledby="modalEditarEmpleadoLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-semibold" id="modalEditarEmpleadoLabel">
              Editar empleado
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <form
              th:action="@{/empleados/guardar}"
              th:object="${empleado}"
              method="post"
              class="row g-3"
            >
              <input type="hidden" name="id" id="editarId" />
              <div class="col-12">
                <label class="form-label" for="editarNombre">Nombre</label>
                <input
                  id="editarNombre"
                  name="nombre"
                  class="form-control"
                  type="text"
                  placeholder="Juan"
                  required
                />
              </div>
              <div class="col-12">
                <label class="form-label" for="editarApellido">Apellido</label>
                <input
                  id="editarApellido"
                  name="apellido"
                  class="form-control"
                  type="text"
                  placeholder="Perez"
                  required
                />
              </div>
              <div class="col-12">
                <label class="form-label" for="editarEmail">Correo</label>
                <input
                  id="editarEmail"
                  name="email"
                  class="form-control"
                  type="email"
                  placeholder="user@ejemplo.com"
                  required
                />
              </div>
              <div class="col-12">
                <label class="form-label" for="editarPassword"
                  >Contraseña</label
                >
                <input
                  id="editarPassword"
                  name="password"
                  class="form-control"
                  type="password"
                  placeholder="********"
                  required
                />
              </div>
              <div class="col-12">
                <label class="form-label" for="editarRol">Rol</label>
                <select id="editarRol" name="rol" class="form-select" required>
                  <option value="" selected disabled>Selecciona un rol</option>
                  <option
                    th:each="r : ${T(com.proyecto.sistema.inventario.entities.Rol).values()}"
                    th:value="${r}"
                    th:text="${r}"
                  ></option>
                </select>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancelar
                </button>
                <button type="submit" class="btn btn-success">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/js/empleado.js}"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    ></script>
