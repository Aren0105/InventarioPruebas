<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid mt-5">
        <div class="text-center" role="alert">
            <h1 class="alert-heading" th:text="|Error: ${error}|">Errorcito!</h1>
            <p th:text="${mensaje}"></p>
            <p class="text-muted" th:text="${detalle}"></p>
            <a th:href="@{/usuarios}" class="btn btn-primary">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
